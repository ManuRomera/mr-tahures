name: Build Foundry Module Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run rules tests
        run: node --test tests/*.test.mjs

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Foundry module ZIP
        shell: bash
        run: |
          zip -r mr-queso-o-mentira.zip module.json scripts styles lang assets templates README.md CHANGELOG.md LICENSE NOTICE.md -x '*.DS_Store'
          unzip -l mr-queso-o-mentira.zip | grep -E "assets/skins/garito/dice/die-1.png|templates/dice-tray.html|styles/skins.css|scripts/engine/mia.js" | wc -l | grep -q 4

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MR- Queso o Mentira v${{ steps.version.outputs.version }}" > notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing assets."
            gh release upload "$TAG" mr-queso-o-mentira.zip module.json --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            echo "Creating release $TAG."
            gh release create "$TAG" mr-queso-o-mentira.zip module.json \
              --target "$GITHUB_SHA" \
              --title "MR- Queso o Mentira v$VERSION" \
              --notes-file notes.md
          fi
